<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 136" role="img" aria-labelledby="lvl-title lvl-desc">
  <title id="lvl-title">Farmer Skills &amp; Level Board</title>
  <desc id="lvl-desc">Stardew Valley RPG skill levels for Writing, Coding, and Crafting.</desc>

  <!-- Outer wood frame & parchment -->
