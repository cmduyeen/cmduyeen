<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 168" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">~/dyn — Notes, Reviews &amp; Personal Projects</title>
  <desc id="banner-desc">Stardew Valley Cozy pixel-art banner for cmduyeen GitHub profile.</desc>

  <!-- Outer dark wood frame -->
  <rect x="0" y="0" width="840" height="168" rx="12" fill="#5b3a29"/>
  <!-- Inner warm wood rim -->
  <rect x="4" y="4" width="832" height="160" rx="9" fill="#8f563b"/>
  <!-- Sky backdrop -->
  <rect x="8" y="8" width="824" height="152" rx="6" fill="#1e2548"/>

  <!-- Stars -->
  <g shape-rendering="crispEdges">
    <rect x="52" y="24" width="4" height="4" fill="#fde68a"/>
    <rect x="148" y="34" width="3" height="3" fill="#fff8e7"/>
    <rect x="260" y="20" width="4" height="4" fill="#fde68a"/>
    <rect x="380" y="28" width="3" height="3" fill="#fff8e7"/>
    <rect x="490" y="22" width="4" height="4" fill="#fde68a"/>
    <rect x="612" y="36" width="3" height="3" fill="#fff8e7"/>
    <rect x="708" y="22" width="4" height="4" fill="#fde68a"/>

    <!-- Crescent Moon -->
    <rect x="772" y="20" width="16" height="16" fill="#fde047"/>
    <rect x="778" y="20" width="12" height="12" fill="#1e2548"/>

    <!-- Pixel Clouds -->
    <rect x="320" y="30" width="56" height="10" fill="#cbd5e1" opacity="0.75"/>
    <rect x="332" y="22" width="32" height="8" fill="#e2e8f0" opacity="0.75"/>
    <rect x="560" y="24" width="48" height="8" fill="#cbd5e1" opacity="0.65"/>
    <rect x="572" y="18" width="24" height="6" fill="#e2e8f0" opacity="0.65"/>

    <!-- Rolling Hills -->
    <rect x="8" y="114" width="290" height="26" fill="#2d5a27"/>
    <rect x="260" y="120" width="310" height="20" fill="#3a6e32"/>
    <rect x="530" y="110" width="302" height="30" fill="#2d5a27"/>

    <!-- Foreground Grass -->
    <rect x="8" y="132" width="824" height="28" fill="#4f8f3c"/>
    <rect x="8" y="132" width="824" height="4" fill="#7ec850"/>

    <!-- Wooden Fence -->
    <rect x="456" y="120" width="6" height="16" fill="#8f563b"/>
    <rect x="476" y="120" width="6" height="16" fill="#8f563b"/>
    <rect x="496" y="120" width="6" height="16" fill="#8f563b"/>
    <rect x="452" y="125" width="54" height="4" fill="#a86a4c"/>

    <!-- Cozy Cottage -->
    <rect x="646" y="96" width="58" height="36" fill="#d9a066"/>
    <rect x="640" y="88" width="70" height="10" fill="#993322"/>
    <rect x="650" y="80" width="50" height="8" fill="#b84430"/>
    <rect x="668" y="112" width="12" height="20" fill="#5b3a29"/>
    <rect x="686" y="106" width="12" height="12" fill="#fde68a"/>
    <rect x="652" y="106" width="10" height="10" fill="#fde68a"/>

    <!-- Pine / Oak Trees -->
    <rect x="752" y="108" width="10" height="26" fill="#5b3a29"/>
    <rect x="738" y="78" width="38" height="32" fill="#2d6a2e"/>
    <rect x="744" y="68" width="26" height="12" fill="#4f8f3c"/>

    <!-- Cute Green Junimo on the hill -->
    <rect x="572" y="108" width="4" height="6" fill="#4f8f3c"/>
    <rect x="568" y="104" width="10" height="4" fill="#7ec850"/>
    <rect x="562" y="114" width="24" height="20" fill="#7ec850"/>
    <rect x="558" y="120" width="32" height="8" fill="#7ec850"/>
    <rect x="566" y="120" width="4" height="4" fill="#2d241c"/>
    <rect x="578" y="120" width="4" height="4" fill="#2d241c"/>
  </g>

  <!-- Left Title Card (Warm Parchment Badge) -->
  <rect x="24" y="28" width="448" height="88" rx="8" fill="#f7eed6" stroke="#8f563b" stroke-width="3"/>
  <text x="42" y="63" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="700" fill="#4f8f3c">~/dyn</text>
  <text x="128" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19.5" font-weight="700" fill="#2d241c">Notes, Reviews &amp; Projects</text>
  <text x="42" y="91" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#5b3a29">Engineering notes, automation workflows &amp; minimalist browser tools.</text>
</svg>
