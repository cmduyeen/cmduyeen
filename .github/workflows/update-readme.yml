name: Update profile README

on:
  schedule:
    # Run daily at 00:17 ICT.
    - cron: '17 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update blog posts
        if: ${{ vars.BLOG_FEED_URL != '' || vars.BLOG_URL == '' }}
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: ${{ vars.BLOG_FEED_URL || 'https://cmduyeen.github.io/index.xml' }}
          max_post_count: 5
          date_format: 'yyyy-mm-dd'
          custom_tags: 'image/image/'
          template: '$newline<table width="100%"><tr><td width="190" height="120" valign="middle"><a href="$url"><img src="$image" alt="$title" width="180" height="113"></a></td><td width="468" height="120" valign="middle"><a href="$url"><strong>$title</strong></a><br><sub>$date</sub></td></tr></table>$newline'
          skip_commit: true
          enable_keepalive: false

      - name: Update repository lists and blog link
        uses: actions/github-script@v7
        env:
          BLOG_URL: ${{ vars.BLOG_URL || 'https://cmduyeen.github.io/' }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repos = await github.paginate(github.rest.repos.listForUser, {
              username: owner,
              type: 'owner',
              per_page: 100
            });
            let readme = fs.readFileSync('README.md', 'utf8');

            const replaceSection = (content, marker, value) => {
              const regex = new RegExp(`(<!-- ${marker}:START -->)[\\s\\S]*?(<!-- ${marker}:END -->)`);
              if (!regex.test(content)) {
                throw new Error(`README is missing markers for ${marker}`);
              }
              return content.replace(regex, (_match, start, end) => `${start}\n${value}\n${end}`);
            };

            const groups = new Map();
            const legacyPriority = [
              'category-theme',
              'category-browser-extension',
              'category-calendar',
              'category-file-management',
              'category-windows-utility',
              'category-command-line',
              'category-productivity'
            ];
            for (const repo of repos) {
              if (
                repo.name.toLowerCase() === context.repo.repo.toLowerCase() ||
                repo.private ||
                repo.archived ||
                repo.fork
              ) {
                continue;
              }

              const topics = repo.topics || [];
              const types = topics.filter((topic) => topic.startsWith('type-') && topic.length > 5);
              if (types.length > 1) {
                throw new Error(`${repo.full_name} has multiple type- topics; keep exactly one primary software type.`);
              }
              const categories = topics.filter((topic) => topic.startsWith('category-') && topic.length > 9);
              if (types.length === 0 && categories.length === 0) continue;

              const type = types[0] || categories.sort((a, b) => {
                const aPriority = legacyPriority.indexOf(a);
                const bPriority = legacyPriority.indexOf(b);
                return (aPriority === -1 ? Number.MAX_SAFE_INTEGER : aPriority) -
                  (bPriority === -1 ? Number.MAX_SAFE_INTEGER : bPriority) ||
                  a.localeCompare(b, 'en', { sensitivity: 'base' });
              })[0].replace(/^category-/, 'type-');
              if (!groups.has(type)) groups.set(type, []);
              groups.get(type).push(repo);
            }

            const generatedGroups = [...groups.entries()]
              .sort(([a], [b]) => a.localeCompare(b, 'en', { sensitivity: 'base' }))
              .map(([type, matchingRepos]) => {
                const title = type.slice('type-'.length).split('-')
                  .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
                  .join(' ');
                const repoList = matchingRepos
                  .sort((a, b) => a.name.localeCompare(b.name, 'en', { sensitivity: 'base' }))
                  .map((repo) => `- [${repo.name}](${repo.html_url})`)
                  .join('\n');
                return `<details>\n<summary><strong>${title}</strong></summary>\n\n${repoList}\n</details>`;
              })
              .join('\n') || '* Add one primary `type-...` GitHub Topic to a repository to create groups automatically.';

            readme = replaceSection(readme, 'MY-STUFF', generatedGroups);
            const blogUrl = process.env.BLOG_URL;
            const blogLink = blogUrl
              ? `> Software, automation, and learning notes: [Visit Dyn](${blogUrl})`
              : '> Blog not configured yet. Add the repository variables `BLOG_URL` and `BLOG_FEED_URL` when it is ready.';
            readme = replaceSection(readme, 'BLOG-LINK', blogLink);
            fs.writeFileSync('README.md', readme);

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git rm --ignore-unmatch README-VI.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: simplify profile README" \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push
          fi
