name: Update profile README

on:
  schedule:
    - cron: '17 17 * * *'
  push:
    paths:
      - '.github/workflows/update-readme.yml'
      - '.github/scripts/update_profile.py'
  repository_dispatch:
    types: [blog_published, sync_profile]
  workflow_dispatch:

concurrency:
  group: profile-readme
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update README
        env:
          BLOG_FEED_URL: ${{ vars.BLOG_FEED_URL || 'https://cmduyeen.github.io/index.xml' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_profile.py

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update profile README [skip ci]"
            git push
          fi
