name: Update profile README

on:
  # Safety net: chạy định kỳ hàng tuần vào Chủ nhật lúc 00:17 ICT (17:17 UTC)
  # thay vì chạy hàng ngày gây lãng phí runner minutes của GitHub Actions.
  schedule:
    - cron: '17 17 * * 0'
  # Kích hoạt hướng sự kiện (Event-driven): Nhận webhook dispatch từ blog khi publish bài viết mới
  repository_dispatch:
    types: [blog_published, sync_profile]
  # Kích hoạt thủ công qua GitHub Actions UI
  workflow_dispatch:

# Tự động hủy các run cũ nếu có run mới kích hoạt, tránh chạy thừa và xung đột git
concurrency:
  group: profile-readme
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update blog posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: ${{ vars.BLOG_FEED_URL || 'https://cmduyeen.github.io/index.xml' }}
          max_post_count: 5
          date_format: 'yyyy-mm-dd'
          template: '$newline- $date: [$title]($url)$newline'
          skip_commit: true
          enable_keepalive: false

      - name: Update project list
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repos = await github.paginate(github.rest.repos.listForUser, {
              username: owner,
              type: 'owner',
              per_page: 100
            });
            let readme = fs.readFileSync('README.md', 'utf8');

            const replaceSection = (content, marker, value) => {
              const regex = new RegExp(`(<!-- ${marker}:START -->)[\\s\\S]*?(<!-- ${marker}:END -->)`);
              if (!regex.test(content)) {
                throw new Error(`README is missing markers for ${marker}`);
              }
              return content.replace(regex, (_match, start, end) => `${start}\n${value}\n${end}`);
            };

            const matchingRepos = [];
            for (const repo of repos) {
              if (
                repo.name.toLowerCase() === context.repo.repo.toLowerCase() ||
                repo.private ||
                repo.archived ||
                repo.fork
              ) {
                continue;
              }

              const topics = repo.topics || [];
              const types = topics.filter((topic) => topic.startsWith('type-') && topic.length > 5);
              if (types.length > 1) {
                throw new Error(`${repo.full_name} has multiple type- topics; keep exactly one primary software type.`);
              }
              const categories = topics.filter((topic) => topic.startsWith('category-') && topic.length > 9);
              if (types.length === 0 && categories.length === 0) continue;
              matchingRepos.push(repo);
            }

            const generatedProjects = matchingRepos
              .sort((a, b) => a.name.localeCompare(b.name, 'en', { sensitivity: 'base' }))
              .map((repo, index) => `${index + 1}. [${repo.name}](${repo.html_url})`)
              .join('\n') || '*No projects yet.*';

            readme = replaceSection(readme, 'MY-STUFF', generatedProjects);
            fs.writeFileSync('README.md', readme);

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update profile README [skip ci]"
            git push
          fi
